# Testset catalog — shared across all config variants.
# Set clean_dir / noisy_dir to your local dataset paths before running
# `--engine_mode infer` (Path 2/3) or `--engine_mode eval`. Entries
# with `null` paths are placeholders; consumers must set them or skip
# the corresponding testset.
#
# WARNING: Selecting a testset_key whose noisy_dir is null will raise
# TypeError in EvalDataset (dataset.py:587 — os.path.join(None, ...)).
# Fill noisy_dir before running --engine_mode infer / eval on that key.
# (clean_dir == null is permitted: dataset.py:592 has a None guard;
# noisy_dir == null currently does not — fix is out of scope here.)

VCTK_DEMAND: # simple denoising subtask
    metrics: ['pesq', 'stoi', 'lsd', 'sdr', 'mcd',
              'wvmos', 'utmos', 'dnsmos',
              'bleu', 'bertscore', 'tokendist']
    sample_rate_src: 16000
    sample_rate_in: 16000
    clean_dir: null  # set to your local dataset path
    noisy_dir: null
    random_sample_idx: [10, 20, 30, 40, 50]

VCTK_SR: # simple super-resolution subtask
    metrics: ['lsd', 'mcd', 'utmos']
    sample_rate_src: 44100
    sample_rate_in: 8000
    clean_dir: null  # set to your local dataset path
    noisy_dir: null
    random_sample_idx: [10, 20, 30, 40, 50]

